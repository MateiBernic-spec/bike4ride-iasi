<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bike 4 Ride Iași</title>
<meta name="description" content="Prezentare neoficială a magazinului și service-ului de biciclete Bike 4 Ride din Iași: locație, program, servicii și prețuri orientative." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1a14; --bg2:#14241b; --ink:#f3eee2; --muted:#a9b3a5; --line:rgba(243,238,226,.14);
    --accent:#d7ff3a; --accent2:#ff7a3d; --card:#182b20;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html.lenis,html.lenis body{height:auto}
  .lenis.lenis-smooth{scroll-behavior:auto!important}
  body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}
  @media(max-width:640px){.wrap{padding:0 16px}}

  /* nav */
  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;mix-blend-mode:difference}
  .logo{font-weight:800;letter-spacing:-.02em;font-size:18px;text-decoration:none}
  .logo span{color:var(--accent)}
  .nav ul{display:flex;gap:22px;list-style:none;font-size:14px;font-weight:600}
  .nav ul a{text-decoration:none;opacity:.85}
  .nav ul a:hover{opacity:1}
  @media(max-width:720px){.nav ul{display:none}}
  .progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:60;width:100%;transform-origin:0 50%;transform:scaleX(0)}

  /* hero */
  .hero{min-height:100svh;position:relative;display:flex;align-items:flex-end;padding:120px 0 60px;overflow:hidden}
  .hero-bg{position:absolute;inset:-10% 0 0 0;z-index:0}
  .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,26,20,.35) 0%,rgba(15,26,20,.55) 50%,var(--bg) 100%)}
  .hero h1{font-size:clamp(64px,13vw,210px);line-height:.86;letter-spacing:-.02em}
  .hero h1 em{color:var(--accent);font-style:italic}
  .line{display:block;overflow:hidden;padding-bottom:.06em}
  .line > span{display:inline-block;will-change:transform}
  .hero-meta{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:28px;align-items:flex-end}
  .hero-meta p{max-width:430px;color:var(--muted);font-size:17px;line-height:1.55}
  .pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;background:rgba(15,26,20,.5);backdrop-filter:blur(8px)}
  .dot{width:9px;height:9px;border-radius:50%;background:#777}
  .dot.on{background:var(--accent);box-shadow:0 0 0 0 rgba(215,255,58,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(215,255,58,0)}100%{box-shadow:0 0 0 0 rgba(215,255,58,0)}}
  .wheel{position:absolute;right:-120px;top:14%;width:min(560px,70vw);opacity:.9;z-index:1;pointer-events:none}
  .hero .wrap{position:relative;z-index:2;width:100%}
  .scroll-hint{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  /* marquee */
  .marquee{border-block:1px solid var(--line);overflow:hidden;padding:22px 0;background:var(--bg2)}
  .marquee-track{display:flex;gap:48px;white-space:nowrap;width:max-content}
  .marquee-track span{font-size:clamp(28px,4vw,52px);font-family:"Instrument Serif",serif}
  .marquee-track i{color:var(--accent);font-style:normal}

  /* sections */
  section{position:relative}
  .sec{padding:140px 0}
  @media(max-width:640px){.sec{padding:90px 0}}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px;display:block}
  .h2{font-size:clamp(44px,7vw,104px);line-height:.95;letter-spacing:-.015em}
  .h2 em{font-style:italic;color:var(--accent)}

  /* about */
  .about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center;margin-top:60px}
  @media(max-width:860px){.about-grid{grid-template-columns:1fr}}
  .big-text{font-size:clamp(22px,2.6vw,34px);line-height:1.35;font-weight:500}
  .big-text .w{opacity:.18;display:inline-block;margin-right:.25em}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
  .stat{border:1px solid var(--line);border-radius:20px;padding:22px}
  .stat b{display:block;font-family:"Instrument Serif",serif;font-weight:400;font-size:52px;line-height:1;color:var(--accent)}
  .stat small{color:var(--muted);font-size:13px;line-height:1.4;display:block;margin-top:8px}
  @media(max-width:520px){.stats{grid-template-columns:1fr}}
  .img-frame{border-radius:28px;overflow:hidden;aspect-ratio:4/5;position:relative;background:var(--card)}
  .img-frame img{width:100%;height:120%;object-fit:cover;display:block;will-change:transform}
  .img-fallback{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#2e4a37,#0f1a14 70%)}
  .cap{position:absolute;left:14px;bottom:12px;font-size:11px;color:rgba(243,238,226,.75);background:rgba(0,0,0,.35);padding:4px 8px;border-radius:6px}

  /* services horizontal */
  .services{overflow:hidden;background:var(--ink);color:var(--bg)}
  .services .eyebrow{color:#3f6b2f}
  .services .h2 em{color:#3f6b2f}
  .svc-head{padding-top:120px}
  .svc-track{display:flex;gap:24px;padding:60px 24px 120px;width:max-content}
  .svc{width:min(420px,82vw);min-height:460px;border-radius:30px;padding:34px;background:#e9e3d3;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .svc:nth-child(2n){background:#dfe8cf}
  .svc .num{font-family:"Instrument Serif",serif;font-size:96px;line-height:.8;color:rgba(15,26,20,.14)}
  .svc h3{font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:18px 0 12px}
  .svc p{font-size:16px;line-height:1.55;color:#3b4a40}
  .svc .ico{width:64px;height:64px;border-radius:50%;background:var(--bg);color:var(--accent);display:grid;place-items:center}
  @media(max-width:760px){
    .svc-track{flex-direction:column;width:auto;padding:40px 16px 90px}
    .svc{width:100%;min-height:auto;gap:24px}
  }

  /* prices */
  .price-wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:60px}
  @media(max-width:820px){.price-wrap{grid-template-columns:1fr}}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px}
  .pcard h3{font-family:"Instrument Serif",serif;font-weight:400;font-size:38px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
  .pcard h3 small{font-family:Manrope;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .prow{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-top:1px solid var(--line);align-items:baseline}
  .prow span{font-size:15px;line-height:1.4}
  .prow span small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .prow b{white-space:nowrap;font-size:16px;color:var(--accent);font-weight:700}
  .note{margin-top:28px;border:1px dashed rgba(215,255,58,.45);border-radius:20px;padding:20px 22px;color:var(--muted);font-size:14px;line-height:1.6}
  .note strong{color:var(--ink)}

  /* gallery parallax */
  .gallery{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:60px}
  .g{border-radius:24px;overflow:hidden;position:relative;background:var(--card)}
  .g img{width:100%;height:125%;object-fit:cover;display:block}
  .g1{grid-column:1/8;aspect-ratio:16/10}
  .g2{grid-column:8/13;aspect-ratio:4/5;margin-top:80px}
  .g3{grid-column:3/11;aspect-ratio:16/9}
  @media(max-width:720px){.g1,.g2,.g3{grid-column:1/13;margin-top:0}}

  /* visit */
  .visit-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:60px}
  @media(max-width:860px){.visit-grid{grid-template-columns:1fr}}
  .hours{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px}
  .hrow{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);font-size:16px}
  .hrow:first-of-type{border-top:0}
  .hrow.today{color:var(--accent);font-weight:700}
  .hrow .closed{color:var(--accent2)}
  .map{border-radius:26px;overflow:hidden;min-height:420px;border:1px solid var(--line);background:var(--card)}
  .map iframe{width:100%;height:100%;min-height:420px;border:0;filter:grayscale(.35) contrast(1.05)}
  .contact{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--line);transition:transform .3s,background .3s}
  .btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .btn:hover{transform:translateY(-3px)}
  .addr{font-size:clamp(28px,3.4vw,44px);line-height:1.1;margin:8px 0 6px}

  /* footer */
  footer{padding:100px 0 40px;border-top:1px solid var(--line)}
  .foot-big{font-family:"Instrument Serif",serif;font-size:clamp(70px,16vw,240px);line-height:.85;letter-spacing:-.02em}
  .foot-big em{color:var(--accent)}
  .foot-cols{display:grid;grid-template-columns:2fr 1fr;gap:40px;margin-top:50px;color:var(--muted);font-size:13px;line-height:1.7}
  @media(max-width:760px){.foot-cols{grid-template-columns:1fr}}
  .foot-cols a{color:var(--ink)}
  .disclaimer{margin-top:28px;font-size:12px;color:var(--muted)}

  @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

<script type="text/babel" data-presets="react">
const { useEffect, useLayoutEffect, useRef, useState } = React;
gsap.registerPlugin(ScrollTrigger);

/* ---------- Date colectate online ---------- */
const SHOP = {
  name: "Bike 4 Ride",
  address: "Strada Sfântul Lazăr nr. 55",
  city: "Iași 700044",
  phone: "+40 758 895 273",
  phoneAlt: "+40 758 314 590",
  email: "bike4ride@yahoo.com",
  mapsQuery: "Strada Sfântul Lazăr 55, Iași",
};

// 0 = duminică ... 6 = sâmbătă
const HOURS = [
  { d: "Luni", i: 1, o: "09:00", c: "18:00" },
  { d: "Marți", i: 2, o: "09:00", c: "18:00" },
  { d: "Miercuri", i: 3, o: "09:00", c: "18:00" },
  { d: "Joi", i: 4, o: "09:00", c: "18:00" },
  { d: "Vineri", i: 5, o: "09:00", c: "18:00" },
  { d: "Sâmbătă", i: 6, o: "09:00", c: "12:00" },
  { d: "Duminică", i: 0, o: null, c: null },
];

const SERVICES = [
  { t: "Service & reparații", p: "Întreținere completă, reparații specializate, verificări detaliate și reglaje tehnice pentru orice tip de bicicletă.", icon: "wrench" },
  { t: "Revizii periodice", p: "Reglaj frâne și schimbătoare, centrare roți, curățare și ungere transmisie — bicicleta iese reglată și cu lanțul curat.", icon: "gear" },
  { t: "Spălătorie biciclete", p: "Curățare minuțioasă a cadrului și componentelor, ca să pedalezi pe o bicicletă care arată și merge ca nouă.", icon: "drop" },
  { t: "Biciclete noi", p: "Magazin cu biciclete pentru oraș, tură sau munte, cu sfaturi la alegere de la oameni care pedalează.", icon: "bike" },
  { t: "Piese & componente", p: "Camere, anvelope, lanțuri, frâne, schimbătoare și tot ce trebuie pentru o reparație rapidă.", icon: "chain" },
  { t: "Accesorii & echipament", p: "Căști, lumini, lacăte, îmbrăcăminte și echipamente pentru ciclism de zi cu zi sau sportiv.", icon: "helmet" },
];

const PRICES = [
  { cat: "Revizii", tag: "pachete", rows: [
    ["Revizie mică", "reglaj frâne & schimbătoare, ungere lanț, verificare generală", "80 – 180"],
    ["Revizie completă", "+ centrare roți, curățare transmisie, gresare cabluri", "250 – 350"],
  ]},
  { cat: "Roți", tag: "jante & butuci", rows: [
    ["Schimb cameră / anvelopă", "", "20 – 40"],
    ["Centrare roată", "în funcție de complexitate", "30 – 80"],
    ["Spițat + centrat roată", "", "80 – 150"],
    ["Service butuc", "desfăcut, curățat, gresat", "30 – 60"],
  ]},
  { cat: "Frâne", tag: "siguranță", rows: [
    ["Reglaj frână", "V-brake sau disc", "15 – 40"],
    ["Schimb plăcuțe / saboți", "include reglaj", "30 – 60"],
    ["Aerisire frână hidraulică", "", "50 – 80"],
  ]},
  { cat: "Transmisie & spălare", tag: "curățenie", rows: [
    ["Reglaj schimbător", "față sau spate", "15 – 50"],
    ["Schimb cablu + cămașă", "include reglaj", "25 – 60"],
    ["Ungere lanț", "", "15"],
    ["Spălare bicicletă", "simplă cu gresare lanț / completă", "25 – 60"],
  ]},
];

const fp = (name, w = 1800) =>
  `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(name)}?width=${w}`;
const IMG = {
  hero: fp("Palatul Culturii Aerial.jpg", 2200),
  repair: fp("Repairing bicycle Shenandoah Valley Bicycle Festival Our Community Place Harrisonburg VA July 2012.jpg"),
  shop: fp("Bike shop (42682109291).jpg"),
  coop: fp("Sopo Bicycle Cooperative.jpg"),
  city: fp("RO IS Iasi , panoramic view 1 .JPG", 2200),
};

/* ---------- Utilitare ---------- */
function bucharestNow() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Bucharest", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t)?.value;
  const map = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return { day: map[get("weekday")], mins: parseInt(get("hour")) * 60 + parseInt(get("minute")) };
}
const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
function openStatus() {
  const { day, mins } = bucharestNow();
  const h = HOURS.find((x) => x.i === day);
  if (h && h.o && mins >= toMin(h.o) && mins < toMin(h.c)) return { open: true, text: `Deschis acum · până la ${h.c}`, day };
  return { open: false, text: "Închis acum", day };
}

function Img({ src, alt, cap, className = "" }) {
  const [ok, setOk] = useState(true);
  return (
    <>
      {ok ? <img src={src} alt={alt} loading="lazy" className={className} onError={() => setOk(false)} /> : <div className="img-fallback" />}
      {cap && ok && <span className="cap">{cap}</span>}
    </>
  );
}

function Icon({ name }) {
  const p = { width: 28, height: 28, fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round", viewBox: "0 0 24 24" };
  switch (name) {
    case "wrench": return <svg {...p}><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>;
    case "gear": return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>;
    case "drop": return <svg {...p}><path d="M12 2.7s6 6.6 6 11.3a6 6 0 0 1-12 0c0-4.7 6-11.3 6-11.3z"/></svg>;
    case "bike": return <svg {...p}><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h2l2.5 11.5M5.5 17.5 9 9h6l-3 8.5H5.5M9 9 8 6H6"/></svg>;
    case "chain": return <svg {...p}><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>;
    default: return <svg {...p}><path d="M3 15a9 9 0 0 1 18 0v2H3z"/><path d="M12 6v4M7 8l2 3M17 8l-2 3"/></svg>;
  }
}

function Wheel({ innerRef }) {
  const spokes = Array.from({ length: 32 }, (_, k) => k * (360 / 32));
  return (
    <svg ref={innerRef} className="wheel" viewBox="0 0 400 400" aria-hidden="true">
      <circle cx="200" cy="200" r="190" fill="none" stroke="#d7ff3a" strokeWidth="14" />
      <circle cx="200" cy="200" r="172" fill="none" stroke="rgba(243,238,226,.35)" strokeWidth="2" strokeDasharray="4 8" />
      <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(243,238,226,.6)" strokeWidth="5" />
      {spokes.map((a, k) => (
        <line key={k} x1="200" y1="200" x2={200 + 158 * Math.cos(((a + (k % 2 ? 7 : -7)) * Math.PI) / 180)} y2={200 + 158 * Math.sin(((a + (k % 2 ? 7 : -7)) * Math.PI) / 180)} stroke="rgba(243,238,226,.55)" strokeWidth="1.3" />
      ))}
      <circle cx="200" cy="200" r="22" fill="#0f1a14" stroke="#d7ff3a" strokeWidth="4" />
      <circle cx="200" cy="200" r="7" fill="#d7ff3a" />
    </svg>
  );
}

/* ---------- App ---------- */
function App() {
  const root = useRef(null);
  const wheelRef = useRef(null);
  const [status, setStatus] = useState(openStatus());

  useEffect(() => { const t = setInterval(() => setStatus(openStatus()), 30000); return () => clearInterval(t); }, []);

  // Lenis smooth scroll legat de GSAP ticker
  useEffect(() => {
    const lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 1, smoothWheel: true });
    lenis.on("scroll", ScrollTrigger.update);
    const raf = (t) => lenis.raf(t * 1000);
    gsap.ticker.add(raf);
    gsap.ticker.lagSmoothing(0);
    document.querySelectorAll('a[href^="#"]').forEach((a) =>
      a.addEventListener("click", (e) => { e.preventDefault(); lenis.scrollTo(a.getAttribute("href"), { offset: -20, duration: 1.6 }); })
    );
    return () => { gsap.ticker.remove(raf); lenis.destroy(); };
  }, []);

  useLayoutEffect(() => {
    const ctx = gsap.context(() => {
      // progress bar
      gsap.to(".progress", { scaleX: 1, ease: "none", scrollTrigger: { start: 0, end: "max", scrub: 0.3 } });

      // hero intro
      const tl = gsap.timeline({ defaults: { ease: "expo.out" } });
      tl.from(".hero .line > span", { yPercent: 115, duration: 1.6, stagger: 0.12 })
        .from(".hero-meta > *", { y: 30, opacity: 0, duration: 1.2, stagger: 0.1 }, "-=1.1")
        .from(wheelRef.current, { scale: 0.6, opacity: 0, rotate: -180, duration: 2 }, 0)
        .from(".nav", { y: -40, opacity: 0, duration: 1 }, 0.3);

      // roata se învârte la scroll
      gsap.to(wheelRef.current, { rotate: 720, ease: "none", scrollTrigger: { trigger: "body", start: 0, end: "max", scrub: 1 } });
      gsap.to(".hero-bg img", { yPercent: 18, scale: 1.08, ease: "none", scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true } });
      gsap.to(".hero h1", { yPercent: -25, opacity: 0.2, ease: "none", scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true } });

      // marquee
      gsap.to(".marquee-track", { xPercent: -50, ease: "none", duration: 28, repeat: -1 });

      // headings reveal
      gsap.utils.toArray(".reveal").forEach((el) => {
        gsap.from(el.querySelectorAll(".line > span"), {
          yPercent: 110, duration: 1.3, ease: "expo.out", stagger: 0.08,
          scrollTrigger: { trigger: el, start: "top 85%" },
        });
      });

      // cuvinte care se aprind
      gsap.to(".big-text .w", { opacity: 1, stagger: 0.05, ease: "none", scrollTrigger: { trigger: ".big-text", start: "top 80%", end: "bottom 45%", scrub: true } });

      // fade-ups
      gsap.utils.toArray(".fade-up").forEach((el) => {
        gsap.from(el, { y: 60, opacity: 0, duration: 1.2, ease: "power3.out", scrollTrigger: { trigger: el, start: "top 88%" } });
      });

      // counters
      gsap.utils.toArray("[data-count]").forEach((el) => {
        const end = parseFloat(el.dataset.count); const dec = el.dataset.dec ? 1 : 0; const o = { v: 0 };
        gsap.to(o, { v: end, duration: 2, ease: "power2.out", scrollTrigger: { trigger: el, start: "top 90%" },
          onUpdate: () => { el.textContent = o.v.toFixed(dec).replace(".", ",") + (el.dataset.suffix || ""); } });
      });

      // parallax imagini
      gsap.utils.toArray(".para img").forEach((img) => {
        gsap.fromTo(img, { yPercent: -12 }, { yPercent: 0, ease: "none", scrollTrigger: { trigger: img.parentElement, start: "top bottom", end: "bottom top", scrub: true } });
      });

      // servicii: scroll orizontal pe desktop
      const mm = gsap.matchMedia();
      mm.add("(min-width: 761px)", () => {
        const track = document.querySelector(".svc-track");
        const dist = () => track.scrollWidth - window.innerWidth;
        gsap.to(track, {
          x: () => -dist(), ease: "none",
          scrollTrigger: { trigger: ".services", start: "top top", end: () => "+=" + dist(), pin: true, scrub: 1, invalidateOnRefresh: true, anticipatePin: 1 },
        });
        gsap.utils.toArray(".svc").forEach((c, k) => gsap.from(c, { rotate: k % 2 ? 4 : -4, y: 40, ease: "none", scrollTrigger: { trigger: ".services", start: "top top", end: "+=900", scrub: true } }));
      });
      mm.add("(max-width: 760px)", () => {
        gsap.utils.toArray(".svc").forEach((c) => gsap.from(c, { y: 60, opacity: 0, duration: 1, ease: "power3.out", scrollTrigger: { trigger: c, start: "top 90%" } }));
      });

      // rânduri de preț
      gsap.utils.toArray(".pcard").forEach((card) => {
        gsap.from(card.querySelectorAll(".prow"), { x: -30, opacity: 0, stagger: 0.07, duration: 0.9, ease: "power3.out", scrollTrigger: { trigger: card, start: "top 80%" } });
      });

      // footer
      gsap.from(".foot-big .line > span", { yPercent: 110, duration: 1.4, ease: "expo.out", stagger: 0.1, scrollTrigger: { trigger: "footer", start: "top 80%" } });
    }, root);

    const refresh = () => ScrollTrigger.refresh();
    window.addEventListener("load", refresh);
    return () => { ctx.revert(); window.removeEventListener("load", refresh); };
  }, []);

  const aboutWords = "Pe strada Sfântul Lazăr, aproape de centrul Iașului, Bike 4 Ride e magazinul și atelierul unde ieșenii își cumpără bicicleta, își repară roata și o duc la spălat. Biciclete, componente, accesorii, echipamente, service și spălătorie — totul sub același acoperiș.".split(" ");

  const L = ({ children }) => <span className="line"><span>{children}</span></span>;

  return (
    <div ref={root}>
      <div className="progress" />
      <nav className="nav">
        <a href="#top" className="logo">BIKE<span>4</span>RIDE</a>
        <ul>
          <li><a href="#despre">Despre</a></li>
          <li><a href="#servicii">Servicii</a></li>
          <li><a href="#preturi">Prețuri</a></li>
          <li><a href="#vizita">Locație & program</a></li>
        </ul>
      </nav>

      {/* HERO */}
      <header className="hero" id="top">
        <div className="hero-bg para" style={{ overflow: "hidden" }}>
          <Img src={IMG.hero} alt="Palatul Culturii din Iași văzut de sus" />
        </div>
        <Wheel innerRef={wheelRef} />
        <div className="wrap">
          <h1 className="serif">
            <L>Aripi pentru</L>
            <L><em>bicicleta</em> ta.</L>
          </h1>
          <div className="hero-meta">
            <p>Magazin, service și spălătorie de biciclete în Iași — {SHOP.address}. Din 2016 pe două roți.</p>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
              <span className="pill"><span className={"dot " + (status.open ? "on" : "")} />{status.text}</span>
              <span className="scroll-hint">Scroll ↓</span>
            </div>
          </div>
        </div>
      </header>

      {/* MARQUEE */}
      <div className="marquee" aria-hidden="true">
        <div className="marquee-track">
          {[0, 1].map((k) => (
            <React.Fragment key={k}>
              <span>Service <i>✦</i></span><span>Revizii <i>✦</i></span><span>Spălătorie <i>✦</i></span>
              <span>Biciclete <i>✦</i></span><span>Componente <i>✦</i></span><span>Accesorii <i>✦</i></span>
              <span>Echipamente <i>✦</i></span><span>Sf. Lazăr 55 <i>✦</i></span>
            </React.Fragment>
          ))}
        </div>
      </div>

      {/* DESPRE */}
      <section className="sec" id="despre">
        <div className="wrap">
          <span className="eyebrow">01 — Despre</span>
          <h2 className="h2 serif reveal"><L>Atelierul de lângă</L><L><em>centrul</em> Iașului</L></h2>
          <div className="about-grid">
            <div>
              <p className="big-text">{aboutWords.map((w, k) => <span className="w" key={k}>{w}</span>)}</p>
              <div className="stats">
                <div className="stat fade-up"><b data-count="98" data-suffix="%">0%</b><small>recomandări pe Facebook (52 de recenzii)</small></div>
                <div className="stat fade-up"><b data-count="4.5" data-dec="1" data-suffix="/5">0</b><small>notă medie pe Cylex, din 152 de recenzii</small></div>
                <div className="stat fade-up"><b data-count="1800" data-suffix="+">0</b><small>urmăritori ai comunității online</small></div>
              </div>
            </div>
            <div className="img-frame para fade-up">
              <Img src={IMG.repair} alt="Mecanic reparând o bicicletă" cap="Foto: Wikimedia Commons (ilustrativ)" />
            </div>
          </div>
        </div>
      </section>

      {/* SERVICII */}
      <section className="services" id="servicii">
        <div className="wrap svc-head">
          <span className="eyebrow">02 — Servicii</span>
          <h2 className="h2 serif reveal"><L>Tot ce-i trebuie</L><L>bicicletei <em>tale</em></L></h2>
        </div>
        <div className="svc-track">
          {SERVICES.map((s, k) => (
            <article className="svc" key={k}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div className="ico"><Icon name={s.icon} /></div>
                <span className="num">{String(k + 1).padStart(2, "0")}</span>
              </div>
              <div><h3>{s.t}</h3><p>{s.p}</p></div>
            </article>
          ))}
        </div>
      </section>

      {/* PRETURI */}
      <section className="sec" id="preturi">
        <div className="wrap">
          <span className="eyebrow">03 — Prețuri</span>
          <h2 className="h2 serif reveal"><L>Tarife <em>orientative</em></L><L>de service</L></h2>
          <div className="price-wrap">
            {PRICES.map((g) => (
              <div className="pcard fade-up" key={g.cat}>
                <h3>{g.cat}<small>{g.tag}</small></h3>
                {g.rows.map(([n, d, p]) => (
                  <div className="prow" key={n}>
                    <span>{n}{d && <small>{d}</small>}</span>
                    <b>{p} lei</b>
                  </div>
                ))}
              </div>
            ))}
          </div>
          <div className="note fade-up">
            <strong>Important:</strong> Bike 4 Ride nu publică online o listă oficială de prețuri. Sumele de mai sus sunt intervale medii practicate în 2025–2026 de service-urile de biciclete din România și servesc doar ca reper. Pentru prețul exact sună la <a href={"tel:" + SHOP.phone.replace(/\s/g, "")}>{SHOP.phone}</a> sau treci pe la atelier.
          </div>
        </div>
      </section>

      {/* GALERIE */}
      <section className="sec" style={{ paddingTop: 0 }}>
        <div className="wrap">
          <span className="eyebrow">04 — Atmosferă</span>
          <h2 className="h2 serif reveal"><L>Pe două roți</L><L>prin <em>Iași</em></L></h2>
          <div className="gallery">
            <div className="g g1 para"><Img src={IMG.shop} alt="Interior de magazin de biciclete" cap="Foto ilustrativ · Wikimedia Commons" /></div>
            <div className="g g2 para"><Img src={IMG.coop} alt="Atelier de reparații biciclete" cap="Foto ilustrativ · Wikimedia Commons" /></div>
            <div className="g g3 para"><Img src={IMG.city} alt="Panoramă Iași spre Palatul Culturii" cap="Iași · Wikimedia Commons" /></div>
          </div>
        </div>
      </section>

      {/* VIZITA */}
      <section className="sec" id="vizita" style={{ background: "var(--bg2)" }}>
        <div className="wrap">
          <span className="eyebrow">05 — Locație & program</span>
          <h2 className="h2 serif reveal"><L>Treci pe la</L><L><em>atelier</em></L></h2>
          <div className="visit-grid">
            <div className="fade-up">
              <p className="addr serif">{SHOP.address},<br />{SHOP.city}</p>
              <p style={{ color: "var(--muted)", marginBottom: 22 }}>Zonă centrală, pe sensul unic dinspre Podu Roș spre centru.</p>
              <div className="hours">
                {HOURS.map((h) => (
                  <div className={"hrow" + (h.i === status.day ? " today" : "")} key={h.d}>
                    <span>{h.d}{h.i === status.day ? " · azi" : ""}</span>
                    {h.o ? <span>{h.o} – {h.c}</span> : <span className="closed">Închis</span>}
                  </div>
                ))}
              </div>
              <div className="contact">
                <a className="btn primary" href={"tel:" + SHOP.phone.replace(/\s/g, "")}>☎ {SHOP.phone}</a>
                <a className="btn" href={"mailto:" + SHOP.email}>✉ {SHOP.email}</a>
                <a className="btn" target="_blank" rel="noopener" href={"https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(SHOP.mapsQuery)}>↗ Indicații</a>
              </div>
              <p style={{ color: "var(--muted)", fontSize: 13, marginTop: 14 }}>Număr alternativ găsit în unele directoare: {SHOP.phoneAlt}. Programul poate varia în sezon sau de sărbători.</p>
            </div>
            <div className="map fade-up">
              <iframe title="Hartă Bike 4 Ride" loading="lazy" referrerPolicy="no-referrer-when-downgrade"
                src={"https://maps.google.com/maps?q=" + encodeURIComponent(SHOP.mapsQuery) + "&z=16&output=embed"} />
            </div>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer>
        <div className="wrap">
          <div className="foot-big"><L>Spor la</L><L><em>pedalat!</em></L></div>
          <div className="foot-cols">
            <div>
              <p><b style={{ color: "var(--ink)" }}>Surse informații:</b> pagina de Facebook Bike 4 Ride, Cylex, Deschis.ro, Firmania, Șoimii Bicicletelor, Termene.ro (BIKE4RIDE SRL, înființată 2016). Repere de preț: listele publice ale service-urilor Bike-Plus, Mos Ion Roata, DARBike, Sirfixalot, Sportlink, BikeXpert.</p>
              <p style={{ marginTop: 10 }}><b style={{ color: "var(--ink)" }}>Fotografii:</b> Wikimedia Commons — „Palatul Culturii Aerial” (domeniu public, Danmariciuc), „RO IS Iasi, panoramic view 1” (CC BY 3.0, Argenna), „Sopo Bicycle Cooperative” (CC BY 2.0, Timothy J Carroll), „Repairing bicycle… Harrisonburg VA” și „Bike shop (42682109291)” (licențe libere, vezi pagina fișierului). Fotografiile cu biciclete sunt ilustrative, nu din magazin.</p>
            </div>
            <div>
              <p>{SHOP.name}<br />{SHOP.address}<br />{SHOP.city}</p>
              <p style={{ marginTop: 10 }}><a href="https://www.facebook.com/Bike4Ridee/" target="_blank" rel="noopener">facebook.com/Bike4Ridee ↗</a></p>
            </div>
          </div>
          <p className="disclaimer">Site de prezentare neoficial, realizat din informații publice. Nu este site-ul oficial al Bike 4 Ride. Date verificate în octombrie 2026.</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
